services:
  - type: web
    name: bms-no-stampede
    env: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "8080"
      - key: ENV
        value: prod

databases:
  - name: bms-db
    databaseName: bms
    user: bms_user
    plan: free
